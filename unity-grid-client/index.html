<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>try { const t = localStorage.getItem('unitygrid-theme') === 'dark' ? 'dark' : 'light'; document.documentElement.dataset.theme = t; if (t === 'dark') { document.documentElement.classList.add('dark'); } } catch { document.documentElement.dataset.theme = 'light'; }</script>
    <title>Unity Grid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
